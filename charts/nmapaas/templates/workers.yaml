{{- range .Values.locations }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nmapaas.fullname" $ }}-worker-{{ .name }}
  labels:
    {{- include "nmapaas.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker
    nmapaas.io/location: {{ .name }}
spec:
  replicas: {{ .replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nmapaas.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: worker
      nmapaas.io/location: {{ .name }}
  template:
    metadata:
      labels:
        {{- include "nmapaas.labels" $ | nindent 8 }}
        app.kubernetes.io/component: worker
        nmapaas.io/location: {{ .name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        sysctls:
          - name: net.ipv4.conf.all.src_valid_mark
            value: "1"
      containers:
        - name: wireguard
          image: {{ $.Values.pia.image }}
          env:
            - name: LOC
              value: {{ .piaLocation | quote }}
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "nmapaas.piaSecret" $ }}
                  key: username
            - name: PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "nmapaas.piaSecret" $ }}
                  key: password
            - name: LOCAL_NETWORK
              value: {{ $.Values.pia.localNetworks | quote }}
            - name: FIREWALL
              value: "1"
            - name: KEEPALIVE
              value: {{ $.Values.pia.keepalive | quote }}
            - name: RECONNECT
              value: {{ ternary "1" "0" $.Values.pia.reconnect | quote }}
            - name: ACTIVE_HEALTHCHECKS
              value: "1"
            - name: EXIT_ON_FATAL
              value: "1"
            - name: POST_UP
              value: touch /pia-shared/ready
            - name: PRE_DOWN
              value: rm -f /pia-shared/ready
            - name: FATAL_SCRIPT
              value: rm -f /pia-shared/ready
            - name: PRE_RECONNECT
              value: rm -f /pia-shared/ready
            - name: POST_RECONNECT
              value: touch /pia-shared/ready
          readinessProbe:
            exec:
              command: ["/scripts/healthcheck.sh"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/scripts/healthcheck.sh"]
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            {{- toYaml $.Values.pia.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: ["NET_ADMIN"]
              drop: ["ALL"]
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: pia-state
              mountPath: /pia
            - name: pia-shared
              mountPath: /pia-shared
        - name: worker
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["nmapaas-worker"]
          envFrom:
            - configMapRef:
                name: {{ include "nmapaas.fullname" $ }}
          env:
            - name: SCAN_LOCATION
              value: {{ .name | quote }}
            - name: WORKER_CONCURRENCY
              value: {{ .concurrency | quote }}
            - name: VPN_READY_FILE
              value: /pia-shared/ready
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml $.Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: pia-shared
              mountPath: /pia-shared
              readOnly: true
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: pia-state
          emptyDir: {}
        - name: pia-shared
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
