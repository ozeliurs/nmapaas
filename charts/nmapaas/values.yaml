image:
  repository: ghcr.io/your-org/nmapaas
  tag: latest
  pullPolicy: IfNotPresent

api:
  replicas: 2
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

auth:
  # Prefer existingSecret in production. It must contain an api-key key.
  existingSecret: ""
  apiKey: change-me

pia:
  # Prefer existingSecret in production. It must contain username and password keys.
  existingSecret: ""
  username: ""
  password: ""
  gluetunImage: qmcgaw/gluetun:v3.40.0
  # Gluetun's firewall otherwise blocks access from workers to in-cluster Redis.
  clusterOutboundSubnets: "10.0.0.0/8"

redis:
  image: redis:8.0-alpine
  storage: 1Gi

scan:
  jobTtlSeconds: 86400
  timeoutSeconds: 3600
  allowPrivateTargets: false
  allowedTargetCidrs: ""

locations:
  - name: us-east
    piaRegion: US East
    replicas: 1
    concurrency: 2
  - name: sweden
    piaRegion: Sweden
    replicas: 1
    concurrency: 2
