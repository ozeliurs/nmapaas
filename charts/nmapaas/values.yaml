image:
  repository: ghcr.io/your-org/nmapaas
  tag: latest
  pullPolicy: IfNotPresent

api:
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

auth:
  existingSecret: ""
  apiKey: change-me

pia:
  existingSecret: ""
  username: ""
  password: ""
  image: ghcr.io/thrnz/docker-wireguard-pia:20260801_master_9e89d10
  # Must include your Kubernetes service and pod networks so workers can reach Redis.
  localNetworks: "10.0.0.0/8"
  keepalive: 25
  reconnect: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

worker:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 512Mi

redis:
  image: redis:8.0-alpine
  storage: 1Gi
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

scan:
  jobTtlSeconds: 86400
  timeoutSeconds: 3600
  allowPrivateTargets: false
  allowedTargetCidrs: ""

locations:
  - name: swiss
    piaLocation: swiss
    replicas: 1
    concurrency: 2
  - name: us-california
    piaLocation: us_california
    replicas: 1
    concurrency: 2
