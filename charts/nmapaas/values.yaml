image:
  repository: ghcr.io/your-org/nmapaas
  tag: latest
  pullPolicy: IfNotPresent

# Merged API + worker: one pod serves HTTP and consumes every location queue.
app:
  # Keep at 1: network namespaces are per-node and would collide.
  replicas: 1
  concurrency: 2
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 160Mi
    limits:
      cpu: "1"
      memory: 512Mi

auth:
  existingSecret: ""
  apiKey: change-me

vpn:
  # Secret holding one WireGuard config per location, with keys named
  # <location>.conf. Either set existingSecret or provide inline configs.
  existingSecret: ""
  configs: {}
  configDir: /etc/vpn

redis:
  image: redis:8.0-alpine
  storage: 1Gi
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

scan:
  jobTtlSeconds: 86400
  timeoutSeconds: 3600
  allowPrivateTargets: false
  allowedTargetCidrs: ""

# Each entry is a scan location. Set `subnet` to give it a WireGuard
# namespace vpn-<name> with a /24 veth pair on <subnet>.0/24 (using the
# config under <name>.conf); omit `subnet` to scan directly without a VPN.
locations:
  - name: de-ber
    subnet: "10.200.1"
  - name: jp-tok
    subnet: "10.200.3"
