services:
  redis:
    image: redis:8.0-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      default:
        ipv4_address: 172.30.0.2

  # Merged API + worker. Runs `nmapaas-netns setup` at startup (see
  # docker-entrypoint.sh) so the veth host ends and NAT rules live in this
  # persistent container's own network namespace, then serves HTTP and
  # consumes the scan queues in-process.
  app:
    image: nmapaas
    build: .
    # Namespace management and `ip netns exec` require root + capabilities.
    user: "0:0"
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      REDIS_URL: redis://172.30.0.2:6379/0
      API_KEY: ${API_KEY:-development-key}
      LOCATIONS: ${LOCATIONS:-de-ber:10.200.1,de-fra:10.200.2,jp-tok:10.200.3}
      VPN_CONFIG_DIR: /etc/vpn
      WORKER_CONCURRENCY: 2
    ports:
      - "8000:8000"
    volumes:
      # One WireGuard config per location, named <location>.conf.
      - ./wireguard:/etc/vpn:ro
    depends_on:
      redis:
        condition: service_started

  # One-shot cleanup: removes the namespaces, veth pairs, and NAT rules that
  # the app created. Run with: docker compose run --rm netns-teardown
  netns-teardown:
    image: nmapaas
    entrypoint: ["nmapaas-netns", "teardown"]
    user: "0:0"
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      LOCATIONS: ${LOCATIONS:-de-ber:10.200.1,de-fra:10.200.2,jp-tok:10.200.3}
      VPN_CONFIG_DIR: /etc/vpn
    volumes:
      - ./wireguard:/etc/vpn:ro
    profiles: ["cleanup"]
    restart: "no"
    network_mode: none

volumes:
  redis-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
