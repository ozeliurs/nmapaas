[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nmapaas"
version = "0.1.0"
description = "A queued Nmap HTTP API scanning through VPN network namespaces"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "redis>=6.2,<7",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "fakeredis>=2.30,<3",
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
nmapaas-netns = "nmapaas.vpn:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nmapaas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
